[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "prism-crawler"
dynamic = ["version"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Aditya Narayana Bhat"}]
keywords = ["crawler", "web-scraping", "asyncio", "retrieval", "robots", "sqlite"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
description = "An adaptive crawler with guarded recovery, source verification and optional local decisions"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.12,<4",
  "certifi>=2026.6",
  "trafilatura>=2,<3",
  "lxml>=5,<7",
  "protego>=0.4,<1",
  "playwright>=1.58,<2",
  "typer>=0.16,<1",
  "rich>=14,<16",
  "pypdf==6.21.2",
]

[project.optional-dependencies]
benchmark = ["html5lib>=1.1,<2"]
laya = ["laya==0.3.20"]
dev = [
  "pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8",
  "ruff>=0.12,<1", "mypy>=1.15,<3", "build>=1.2,<2", "twine>=6,<8", "pip-audit>=2.9,<3",
]

[project.urls]
Homepage = "https://github.com/Ad1tyaNarayana/prism-crawler"
Repository = "https://github.com/Ad1tyaNarayana/prism-crawler"
Documentation = "https://github.com/Ad1tyaNarayana/prism-crawler/tree/main/docs"
Issues = "https://github.com/Ad1tyaNarayana/prism-crawler/issues"
Changelog = "https://github.com/Ad1tyaNarayana/prism-crawler/blob/main/CHANGELOG.md"

[project.scripts]
prism = "optimal_crawler.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/optimal_crawler", "src/prism_crawler"]

[tool.hatch.version]
path = "src/optimal_crawler/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/benchmarks", "/experiments", "/tools", "/examples/*.py",
  "/docs", "/README.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md",
  "/CODE_OF_CONDUCT.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/pyproject.toml",
  "/requirements-core.lock",
]
exclude = ["/docs/substack-draft.md", "**/__pycache__", "**/*.pyc"]

[tool.mypy]
python_version = "3.11"
files = ["src/prism_crawler"]
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["prism_crawler", "optimal_crawler"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

