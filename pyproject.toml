[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optimal-crawler"
version = "0.1.0"
description = "An adaptive crawler with guarded recovery, source verification and optional local decisions"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.12,<4",
  "certifi>=2026.6",
  "trafilatura>=2,<3",
  "lxml>=5,<7",
  "protego>=0.4,<1",
  "playwright>=1.58,<2",
  "typer>=0.16,<1",
  "rich>=14,<15",
  "pypdf==6.21.1",
]

[project.optional-dependencies]
laya = ["laya==0.3.20"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
prism = "optimal_crawler.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/optimal_crawler"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

